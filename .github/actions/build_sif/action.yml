name: Build SIF
description: Install Apptainer, then restore or build the CI SIF image
defaults:
  run:
    shell: bash

inputs:
  apptainer-version:
    description: 'Pinned Apptainer release version without the leading v'
    default: '1.3.4'
  apptainer-sha256:
    description: 'Expected SHA-256 digest of the pinned Apptainer Debian package'
    default: 'e6bc4f2a12adf20a98d53e4a0865418c42ff650991179e7f9f9f54cb6bf0f7a9'

runs:
  using: "composite"
  steps:
  - uses: ./.github/actions/setup_apptainer
    with:
      apptainer-version: ${{ inputs.apptainer-version }}
      apptainer-sha256: ${{ inputs.apptainer-sha256 }}

  - name: Prepare SIF directory
    run: |
      sudo mkdir -p /usr/share/sif
      sudo chown -R "$USER:$USER" /usr/share/sif
    shell: bash

  - name: Restore SIF file from cache
    uses: actions/cache@v4
    id: sif_cache
    with:
      key: sif-${{ runner.os }}-${{ runner.arch }}-apptainer-${{ inputs.apptainer-version }}-${{ hashFiles('container/ci/apptainer.def') }}
      path: /usr/share/sif/agentbox.ci.sif

  - name: Build SIF file
    if: ${{ steps.sif_cache.outputs.cache-hit != 'true' }}
    run: apptainer build --fakeroot /usr/share/sif/agentbox.ci.sif container/ci/apptainer.def
    shell: bash
