name: Setup Apptainer
description: Download, verify, and install a pinned Apptainer Debian package

inputs:
  apptainer-version:
    description: Apptainer release version without the leading v
    required: true
  apptainer-sha256:
    description: Expected SHA-256 digest of the Apptainer Debian package
    required: true

runs:
  using: composite
  steps:
    - name: Install Apptainer
      shell: bash
      env:
        APPTAINER_VERSION: ${{ inputs.apptainer-version }}
        APPTAINER_SHA256: ${{ inputs.apptainer-sha256 }}
      run: bash "${GITHUB_ACTION_PATH}/install.sh"
