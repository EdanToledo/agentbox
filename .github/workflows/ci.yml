name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Formatting
        run: ufmt check .

      - name: Linting
        run: ruff check --output-format=github .

      - name: Type checking
        run: bash scripts/typecheck.sh

      - name: Tests
        run: pytest -v --timeout=300

  container-smoke:
    name: Apptainer smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Build CI image
        uses: ./.github/actions/build_sif

      - name: Basic smoke test
        run: python examples/ci/ci_basic_smoketest.py

      - name: Fuzz smoke test
        run: python examples/ci/ci_fuzz_smoketest.py
